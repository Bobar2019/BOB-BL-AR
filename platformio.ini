; =============================================================================
;  BOB BL AR — Manette de jeu BLE (HID) pilotée par les mouvements de tête
;  Socle : ESP32-C6 · AP+STA + portail captif + interface web (interface_base.md)
; =============================================================================

; NOTE C6 : le framework Arduino pour ESP32-C6 exige le cœur 3.x. La plateforme
; officielle `espressif32` est encore figée sur le cœur 2.0.x (sans C6) : on
; utilise donc la plateforme pioarduino (déjà en cache local : 54.03.21 = cœur
; 3.2.1). Pour une version plus récente : https://github.com/pioarduino/platform-espressif32
[platformio]
default_envs = esp32-c6-devkitc-1

[env:esp32-c6-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; DevKit N8 = 8 Mo de flash : app 5 Mo + LittleFS ~3 Mo
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    ; « Serial » routé sur le port USB Serial/JTAG natif du C6.
    ; NOTE C6 : sans USB_MODE=1, le cœur 3.x pointe « Serial » vers l’USB OTG
    ; (USBSerial) qui n’existe pas sur le C6 → erreur de compilation.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
    ; AsyncTCP : pile confortable — 4096 a provoqué un débordement (exception
    ; et redémarrage au scan Wi-Fi) ; les handlers manipulent JsonDocument + String.
    -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
    -D CONFIG_ASYNC_TCP_QUEUE_SIZE=64

; Version Git injectée dans include/git_version.h (git describe)
extra_scripts = pre:scripts/git_version.py

lib_deps =
    ; --- Socle web (cf. interface_base.md §5.2) ---
    ESP32Async/ESPAsyncWebServer @ ^3.11.0   ; fork maintenu, cœur 3.x, ESP32-C6 OK
    ESP32Async/AsyncTCP @ ^3.4.10
    bblanchon/ArduinoJson @ ^7.0.0
    ; --- BLE HID ---
    ; La lib BleGamepad de lemmingDev v5.x repose sur NimBLE-Arduino 1.x
    ; (incompatible ESP32-C6) : on construit la manette HID directement sur
    ; NimBLE-Arduino 2.x (NimBLEHIDDevice), support natif du C6.
    h2zero/NimBLE-Arduino @ ^2.5.1
